[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webmind-mcp"
version = "1.0.0"
description = "WebMind MCP server — exposes browser agent control via Model Context Protocol"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.0.0",
    "websockets>=12.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
webmind-mcp = "webmind_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["webmind_mcp"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyright>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
