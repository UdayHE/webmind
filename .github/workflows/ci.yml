name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── TypeScript packages ─────────────────────────────────────────────────────
  ts-build:
    name: TypeScript Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit --project tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Build libraries
        run: npm run build:libs

  # ─── TypeScript tests ────────────────────────────────────────────────────────
  ts-test:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    needs: ts-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

  # ─── Chrome extension ────────────────────────────────────────────────────────
  ext-build:
    name: Extension Build
    runs-on: ubuntu-latest
    needs: ts-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build libraries (required by extension)
        run: npm run build:libs

      - name: Build extension
        run: npm run build:ext

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: webmind-extension
          path: packages/extension/.output/chrome-mv3/
          retention-days: 7

  # ─── Python MCP server ───────────────────────────────────────────────────────
  python-check:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Type-check (pyright)
        run: uv run pyright webmind_mcp/ || true

      - name: Lint (ruff)
        run: uv run ruff check webmind_mcp/

      - name: Format check (ruff)
        run: uv run ruff format --check webmind_mcp/

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short || true
